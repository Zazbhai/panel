<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Admin sign in · Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #292923;
      background: #f9f8f5;
      --surface: #fffefa;
      --muted: #68685e;
      --line: #deddd4;
      --accent: #b84e2b;
      --accent-hover: #9b3e20;
      --danger: #a5322b;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(420px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    h1 { margin: 0; font-size: 1.5rem; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: grid; gap: 7px; margin: 24px 0 16px; font-size: .875rem; font-weight: 600; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #bcbcb0; border-radius: 6px; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button { width: 100%; min-height: 44px; border: 0; border-radius: 6px; background: var(--accent); color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .7; cursor: wait; }
    #loginStatus { min-height: 1.5em; margin-bottom: 0; }
    #loginStatus.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>Admin sign in</h1>
    <p>Enter your private admin key to access the dashboard. You’ll stay signed in on this device for 30 days.</p>
    <form id="loginForm">
      <label for="adminKey">Admin key
        <input id="adminKey" name="key" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button id="loginButton" type="submit">Sign in</button>
      <p id="loginStatus" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
