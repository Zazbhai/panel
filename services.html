  <title>Services · Dashboard</title>
  <style data-dashboard-styles>

        const controls = Array.from(dialog.querySelectorAll("button:not(:disabled)"));
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      dialog.querySelector(".dialog-description").textContent = description;
      const confirm = dialog.querySelector(".dialog-confirm");
      confirm.textContent = confirmLabel;
      if (danger) confirm.classList.add("danger", "primary");
      const content = dialog.querySelector(".dialog-content");
      if (fields.length) {
        const list = document.createElement("dl");
        list.className = "dialog-fields";
        fields.forEach(([label, value]) => {
          const term = document.createElement("dt");
          const detail = document.createElement("dd");
          term.textContent = label;
          detail.textContent = String(value);
          list.append(term, detail);
        });
        content.append(list);
      }
      if (message) {
        const preview = document.createElement("p");
        preview.className = "dialog-message";
        preview.textContent = message;
        content.append(preview);
      }
      document.body.append(dialog);
      return new Promise((resolve) => {
        dialog.addEventListener("close", () => {
          const accepted = dialog.returnValue === "confirm";
          dialog.remove();
          dialogActive = false;
          if (trigger?.isConnected) trigger.focus();
          resolve(accepted);
        }, { once: true });
        dialog.showModal();
      });
    }
  };
})();
  </script>
  <script src="/api-client.js" defer></script>
  <script src="/services.js" defer></script>
</body>
